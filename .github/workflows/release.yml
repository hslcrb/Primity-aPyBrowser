name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: primity-browser-linux
            asset_name: primity-browser-linux.zip
          - os: macos-latest
            artifact_name: primity-browser-macos
            asset_name: primity-browser-macos.zip
          - os: windows-latest
            artifact_name: primity-browser-windows
            asset_name: primity-browser-windows.zip

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Get Version
      id: get_version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        else
          # Start from v0.0.0 if no tags found, otherwise increment based on last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          # Simple increment logic: increment patch version
          # Remove 'v' prefix
          VERSION_NO_V=${LAST_TAG#v}
          IFS='.' read -r -a parts <<< "$VERSION_NO_V"
          MAJOR=${parts[0]}
          MINOR=${parts[1]}
          PATCH=${parts[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v$MAJOR.$MINOR.$NEW_PATCH"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Build with PyInstaller
      shell: bash
      run: |
        # Use simple separator dependent on OS
        if [ "$RUNNER_OS" == "Windows" ]; then
          SEP=";"
        else
          SEP=":"
        fi
        pyinstaller --noconfirm --onedir --windowed --name "PrimityBrowser" --add-data "README.md${SEP}." main.py

    - name: Zip Artifacts (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        zip -r ../${{ matrix.asset_name }} PrimityBrowser/

    - name: Zip Artifacts (Windows)
      if: runner.os == 'Windows'
      run: |
        cd dist
        Compress-Archive -Path PrimityBrowser -DestinationPath ..\${{ matrix.asset_name }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.asset_name }}

    - name: Create Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ matrix.asset_name }}
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: Release ${{ steps.get_version.outputs.VERSION }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
